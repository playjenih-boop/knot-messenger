name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create Android platform files
        run: flutter create . --platforms=android

      - name: Fix Android Manifest and Network Security
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Добавляем интернет-разрешение
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            fi
            # Добавляем флаг разрешающий сетевые запросы
            if ! grep -q "android:usesCleartextTraffic" "$MANIFEST"; then
              sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
            fi
            echo "Manifest patched successfully."
          fi

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
