
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create Android platform files
        run: flutter create . --platforms=android

      - name: Fix Android Manifest and Network Security
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST" ]; then

            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            fi

            if ! grep -q "android:usesCleartextTraffic" "$MANIFEST"; then
              sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
            fi

            echo "Manifest patched successfully."
          else
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

      - name: Configure Supabase Deep Links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          if 'android:scheme="io.supabase.knot"' not in content:

              block = '''
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data
                              android:scheme="io.supabase.knot"
                              android:host="login-callback" />
                      </intent-filter>
              '''

              if "</activity>" not in content:
                  raise RuntimeError("Activity not found in AndroidManifest.xml")

              content = content.replace(
                  "</activity>",
                  block + "\n        </activity>",
                  1
              )

              manifest.write_text(content)

          print("Supabase Deep Link configured successfully.")
          PY

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
